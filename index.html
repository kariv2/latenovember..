<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Late November</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. 100% SCREEN-FILLED CODE BACKGROUND */
    #code-viewport {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #05070c;
      display: flex;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(6.2px, 1.1vw, 8px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      z-index: 0;
      opacity: 0.85;
      pointer-events: none;
      overflow: hidden;
    }

    .code-pane {
      flex: 1;
      display: flex;
      padding: 6px 10px;
      border-right: 1px solid #101622;
      overflow: hidden;
    }

    .gutter {
      width: 28px;
      text-align: right;
      padding-right: 6px;
      color: #242c3d;
      user-select: none;
      border-right: 1px solid #0d121c;
    }

    .code-content {
      flex: 1;
      padding-left: 8px;
      white-space: pre;
      color: #9aa5b5;
      overflow: hidden;
    }

    .kw { color: #f47067; font-weight: bold; }
    .fn { color: #dcbdfb; }
    .str { color: #96d0ff; }
    .type { color: #8ddb8c; }
    .hex { color: #6cb6ff; }
    .comm { color: #384252; font-style: italic; }
    .var { color: #adbac7; }

    #dark-veil {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 55%, rgba(6, 8, 13, 0.35) 0%, rgba(3, 4, 7, 0.84) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================
       2. LARGER SAD CARD (ONE SIDE + MULTI-ANGLE DRIFT)
       ========================================================== */
    .sad-card {
      position: fixed;
      /* BIGGER DIMENSIONS */
      width: min(90vw, 420px);
      min-height: 135px;
      padding: 24px 28px;
      background: linear-gradient(150deg, rgba(21, 29, 42, 0.95) 0%, rgba(9, 14, 23, 0.97) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(176, 196, 222, 0.38);
      border-radius: 14px;
      box-shadow: 
        0 20px 42px rgba(0, 0, 0, 0.9),
        0 6px 22px rgba(30, 58, 95, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);
      z-index: 9999;
      pointer-events: none;
      
      /* Multi-angle dynamic float lifecycle */
      animation: cardLifecycle 8.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
    }

    .sad-card::before {
      content: ''; position: absolute; inset: 6px;
      border: 1px solid rgba(176, 196, 222, 0.16); border-radius: 9px; pointer-events: none;
    }

    .card-meta {
      font-family: 'Courier New', monospace; 
      font-size: 11px; 
      letter-spacing: 0.18em;
      text-transform: uppercase; 
      color: rgba(176, 196, 222, 0.65); 
      text-align: center; 
      margin-bottom: 9px;
    }

    .card-lyric {
      color: #edf2f7; 
      font-size: 19px; /* BIGGER, CLEARER TEXT */
      font-weight: 550; 
      line-height: 1.5;
      letter-spacing: -0.015em; 
      text-align: center; 
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
    }

    .lyric-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(5px);
      animation: wordReveal 0.26s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: 0 3px;
    }
    @keyframes wordReveal { to { opacity: 1; transform: translateY(0); } }

    .doodle-emote {
      display: inline-block;
      margin-left: 8px;
      font-family: 'Courier New', monospace;
      font-size: 16px;
      font-weight: bold;
      color: #90cdf4;
      border: 1px solid rgba(144, 205, 244, 0.4);
      padding: 2px 7px;
      border-radius: 7px;
      background: rgba(144, 205, 244, 0.1);
      letter-spacing: 0.05em;
      animation: gentlePulse 1.4s ease infinite;
      vertical-align: middle;
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* DYNAMIC MULTI-ANGLE FLOAT KEYFRAME */
    @keyframes cardLifecycle {
      0% {
        opacity: 0;
        /* Enters from a diagonal angle based on --start-dx and --rot */
        transform: translate3d(var(--start-dx, 0px), 40px, 0) scale(0.9) rotate(calc(var(--rot, 0deg) * 1.4));
      }
      7% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotate(var(--rot, 0deg));
      }
      75% {
        opacity: 1;
        transform: translate3d(calc(var(--start-dx, 0px) * -0.4), -370px, 0) scale(1) rotate(var(--rot, 0deg));
      }
      100% {
        opacity: 0;
        transform: translate3d(calc(var(--start-dx, 0px) * -0.8), -480px, 0) scale(0.94) rotate(calc(var(--rot, 0deg) * 0.8));
      }
    }

    /* Ambient Drawing Doodles */
    .ambient-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #e2e8f0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(144, 205, 244, 0.3);
      animation: floatDoodle 5.8s ease-out forwards;
      opacity: 0.75;
      letter-spacing: 0.08em;
    }

    @keyframes floatDoodle {
      0% { transform: translateY(0) scale(0.75) rotate(0deg); opacity: 0; }
      20% { opacity: 0.85; transform: translateY(-30px) scale(1.05) rotate(5deg); }
      75% { opacity: 0.85; }
      100% { transform: translateY(-340px) scale(1.2) rotate(-8deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Dynamic code viewport -->
  <div id="code-viewport"></div>
  <div id="dark-veil"></div>

  <script>
    // 1. DYNAMICALLY FILLS 100% OF SCREEN
    function fillCodeBackground() {
      const container = document.getElementById('code-viewport');
      container.innerHTML = '';
      
      const snippets = [
        '<span class="kw">#include</span> <span class="str">&lt;immintrin.h&gt;</span>',
        '<span class="kw">template</span>&lt;<span class="kw">typename</span> <span class="type">Scalar</span>&gt;',
        '<span class="kw">struct</span> <span class="type">FFTSpectrumEngine</span> {',
        '    <span class="type">size_t</span> <span class="var">dim</span> = <span class="hex">4096</span>;',
        '    <span class="type">uintptr_t</span> <span class="var">alloc_ptr</span> = <span class="hex">0x7FFE9B42A000</span>;',
        '    <span class="fn">execute_butterfly</span>(<span class="var">a</span>, <span class="var">stride</span>);',
        '    __m512d <span class="var">acc</span> = <span class="fn">_mm512_fmadd_pd</span>(<span class="var">r</span>, <span class="var">i</span>, <span class="var">r</span>);',
        '};',
        '<span class="comm">// HESSIAN DRIFT EIGEN ACCUMULATOR</span>',
        '<span class="kw">class</span> <span class="type">NonlinearDriftSolver</span> {',
        '    <span class="type">double</span> <span class="var">jacobian_tensor</span>[<span class="hex">4</span>][<span class="hex">4</span>];',
        '    <span class="fn">eigen_decomp_4x4</span>(<span class="var">jacobian_tensor</span>);',
        '};',
        '<span class="kw">async def</span> <span class="fn">stream_cadence</span>(self) -&gt; <span class="type">AsyncGen</span>:',
        '    <span class="var">cues</span> = [(<span class="hex">0.6</span>, <span class="str">"November"</span>), (<span class="hex">17.2</span>, <span class="str">"call"</span>)]',
        '    <span class="kw">yield</span> {<span class="str">"epoch"</span>: <span class="var">t</span>, <span class="str">"hash"</span>: <span class="hex">0x9E3779B9</span>}',
        '<span class="kw">__global__ void</span> <span class="fn">VectorKernel</span>(<span class="type">float</span>* <span class="var">d_out</span>) {',
        '    <span class="type">int</span> <span class="var">idx</span> = blockIdx.x * blockDim.x + threadIdx.x;',
        '    <span class="var">d_out</span>[<span class="var">idx</span>] = <span class="fn">__fmul_rn</span>(<span class="var">val</span>, <span class="hex">0.9984f</span>);',
        '}'
      ];

      const cols = window.innerWidth > 800 ? 3 : 2;
      const linesNeeded = Math.ceil(window.innerHeight / 10) + 12;

      let lineCounter = 1;
      for (let c = 0; c < cols; c++) {
        const pane = document.createElement('div');
        pane.className = 'code-pane';
        
        let gutterHtml = '';
        let codeHtml = '';
        
        for (let l = 0; l < linesNeeded; l++) {
          gutterHtml += `${lineCounter}<br>`;
          codeHtml += snippets[(l + c * 6) % snippets.length] + '<br>';
          lineCounter++;
        }
        
        pane.innerHTML = `<div class="gutter">${gutterHtml}</div><div class="code-content">${codeHtml}</div>`;
        container.appendChild(pane);
      }
    }

    // 2. TIMED LYRICS ENGINE
    const TIMED_LYRICS = [
      { time: 0.6,  text: "when i said, November's early", duration: 1.8, emote: "~ ♡" },
      { time: 2.8,  text: "to be playing these songs",     duration: 1.9, emote: "[ ♫ ]" },
      { time: 10.2, text: "now when i look back",          duration: 1.6, emote: "( . . )" },
      { time: 12.4, text: "i can see i was wrong",         duration: 1.8, emote: "</3" },
      { time: 17.2, text: "so what if i call",             duration: 2.4, emote: "[ ☎ ]" },
      { time: 22.0, text: "and you pick up the phone?",    duration: 2.6, emote: "? <3" }
    ];

    let activeCards = [];
    let cardCount = 0;

    function playLoop() {
      TIMED_LYRICS.forEach(item => {
        setTimeout(() => {
          spawnWordByWordCard(item.text, item.duration, item.emote);
          cardCount++;
        }, item.time * 1000);
      });
      setTimeout(playLoop, 28000); // Loops continuously
    }

    function init() {
      fillCodeBackground();
      setInterval(spawnAmbientDoodle, 500);
      playLoop();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
      window.addEventListener('load', init);
    }
    window.addEventListener('resize', fillCodeBackground);

    function spawnWordByWordCard(fullText, vocalDuration, emote) {
      const card = document.createElement('div');
      card.className = 'sad-card';
      card.innerHTML = `<div class="card-meta">✦ LATE NOVEMBER • 02:00 AM ✦</div><div class="card-lyric"></div>`;

      // --- DIFFERENT ENTRANCE ANGLE & TILT FOR EVERY CARD ---
      // Alternates natural angles: -3.5° to +3.8°
      const angleSign = (cardCount % 2 === 0) ? 1 : -1;
      const tiltAngle = angleSign * (1.8 + (Math.random() * 2.0));
      // Varied horizontal entry angle offset
      const startAngleDx = ((cardCount % 3) - 1) * 28;

      card.style.setProperty('--rot', `${tiltAngle}deg`);
      card.style.setProperty('--start-dx', `${startAngleDx}px`);

      document.body.appendChild(card);

      const cardWidth = card.offsetWidth || 380;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      let targetX, targetY;

      // --- ANCHORED TO ONE SIDE ONLY (RIGHT SIDE) ---
      if (screenW < 700) {
        // Mobile screen: comfortable centered-right placement
        targetX = Math.max(16, (screenW - cardWidth) / 2);
        targetY = screenH * 0.68;
      } else {
        // iPad / Large Screen: Anchored to the RIGHT SIDE with margin
        const rightMargin = Math.max(30, screenW * 0.08);
        targetX = screenW - cardWidth - rightMargin;
        targetY = screenH * 0.64;
      }

      card.style.left = `${targetX}px`;
      card.style.top = `${targetY}px`;
      const cardObj = { el: card, y: targetY };
      activeCards.push(cardObj);

      // Word-by-Word Engine
      const lyricEl = card.querySelector('.card-lyric');
      const words = fullText.split(' ');
      const perWordDelay = (vocalDuration * 1000) / words.length;

      words.forEach((word, index) => {
        setTimeout(() => {
          const span = document.createElement('span');
          span.className = 'lyric-word';
          span.textContent = word;
          lyricEl.appendChild(span);

          if (emote && index === words.length - 1) {
            const emoteEl = document.createElement('span');
            emoteEl.className = 'doodle-emote';
            emoteEl.textContent = emote;
            lyricEl.appendChild(emoteEl);
          }
        }, index * perWordDelay);
      });

      // Cleanup
      setTimeout(() => {
        card.remove();
        activeCards = activeCards.filter(c => c !== cardObj);
      }, 8500);
    }

    function spawnAmbientDoodle() {
      const doodleList = ['<3', '♡', '</3', '✧', '˚₊·', '˙ᵕ˙', '( . . )', '[ ✉ ]', '*ੈ✩'];
      const el = document.createElement('div');
      el.className = 'ambient-doodle';
      el.textContent = doodleList[Math.floor(Math.random() * doodleList.length)];
      
      const size = Math.floor(13 + Math.random() * 8);
      el.style.fontSize = `${size}px`;
      
      const x = Math.floor(Math.random() * (window.innerWidth - 45));
      const y = Math.floor(window.innerHeight * 0.72 + Math.random() * (window.innerHeight * 0.22));

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 5800);
    }
  </script>
</body>
</html>
