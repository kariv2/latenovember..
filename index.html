<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Late November</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. SCREEN-FILLED CODE BACKGROUND */
    #code-viewport {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #05070c;
      display: flex;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(6.2px, 1.1vw, 8px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      z-index: 0;
      opacity: 0.82;
      pointer-events: none;
      overflow: hidden;
      transition: filter 1s ease, opacity 1s ease;
    }

    .code-pane {
      flex: 1;
      display: flex;
      padding: 6px 10px;
      border-right: 1px solid #101622;
      overflow: hidden;
    }

    .gutter {
      width: 28px;
      text-align: right;
      padding-right: 6px;
      color: #242c3d;
      user-select: none;
      border-right: 1px solid #0d121c;
    }

    .code-content {
      flex: 1;
      padding-left: 8px;
      white-space: pre;
      color: #9aa5b5;
      overflow: hidden;
    }

    .kw { color: #f47067; font-weight: bold; }
    .fn { color: #dcbdfb; }
    .str { color: #96d0ff; }
    .type { color: #8ddb8c; }
    .hex { color: #6cb6ff; }
    .comm { color: #384252; font-style: italic; }
    .var { color: #adbac7; }

    #dark-veil {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 55%, rgba(6, 8, 13, 0.3) 0%, rgba(3, 4, 7, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================
       2. BEAT DROP CINEMATIC SHOCKWAVE & SCREEN TREMOR
       ========================================================== */
    #beat-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 60%, rgba(144, 205, 244, 0.45) 0%, rgba(15, 25, 45, 0.85) 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 9000;
    }
    #beat-flash.active {
      animation: shockwavePulse 2.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes shockwavePulse {
      0% { opacity: 0.95; }
      20% { opacity: 0.35; }
      100% { opacity: 0; }
    }

    /* Emotional Camera Tremor on Beat Drop */
    body.tremor-active {
      animation: emotionalTremor 0.65s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes emotionalTremor {
      10%, 90% { transform: translate3d(-1px, 2px, 0); }
      20%, 80% { transform: translate3d(2px, -2px, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 2px, 0); }
      40%, 60% { transform: translate3d(4px, -3px, 0); }
    }

    /* ==========================================================
       3. EXTRA-LARGE SAD CARD (CONTINUOUS FLOW)
       ========================================================== */
    .sad-card {
      position: fixed;
      width: min(92vw, 520px);
      min-height: 150px;
      padding: 28px 34px;
      background: linear-gradient(150deg, rgba(21, 29, 44, 0.96) 0%, rgba(8, 13, 21, 0.98) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(210, 230, 255, 0.55);
      border-radius: 16px;
      box-shadow: 
        0 24px 50px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(144, 205, 244, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 9999;
      pointer-events: none;
      will-change: transform, opacity;
      transition: border-color 0.8s, box-shadow 0.8s, transform 0.8s;
    }

    .sad-card::before {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(210, 230, 255, 0.25); border-radius: 11px; pointer-events: none;
    }

    /* CLIMAX BLOOM (Ignites on the beat drop) */
    .sad-card.climax-bloom {
      border-color: rgba(188, 227, 255, 0.9) !important;
      box-shadow: 
        0 30px 65px rgba(0, 0, 0, 0.95),
        0 0 50px rgba(144, 205, 244, 0.7),
        inset 0 0 25px rgba(144, 205, 244, 0.35) !important;
      animation: climaxHover 7.0s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
    }
    @keyframes climaxHover {
      0% { transform: scale(1) translateY(0); }
      15% { transform: scale(1.04) translateY(-15px); }
      100% { transform: scale(1.02) translateY(-140px); opacity: 0.96; }
    }

    .from-left {
      animation: flowFromLeft 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromLeft {
      0% { opacity: 0; transform: translate3d(-70px, 45px, 0) scale(0.92) rotate(-3deg); }
      12% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(-1.2deg); }
      100% { opacity: 1; transform: translate3d(18px, -110px, 0) scale(1) rotate(-0.5deg); }
    }

    .from-right {
      animation: flowFromRight 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromRight {
      0% { opacity: 0; transform: translate3d(70px, 45px, 0) scale(0.92) rotate(3deg); }
      12% { opacity: 1; transform: translate3d(0, 0, 0) scale(1) rotate(1.2deg); }
      100% { opacity: 1; transform: translate3d(-18px, -110px, 0) scale(1) rotate(0.5deg); }
    }

    .sad-card.exiting {
      animation: exitDissolve 0.4s ease-out forwards !important;
    }
    @keyframes exitDissolve {
      to { opacity: 0; transform: translateY(-145px) scale(0.94); }
    }

    .card-meta {
      font-family: 'Courier New', monospace; 
      font-size: 11.5px; 
      letter-spacing: 0.2em;
      text-transform: uppercase; 
      color: rgba(210, 230, 255, 0.8); 
      text-align: center; 
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(144, 205, 244, 0.4);
      transition: color 0.6s;
    }

    .card-lyric {
      color: #ffffff;
      font-size: clamp(20px, 2.5vw, 25px); 
      font-weight: 650; 
      line-height: 1.5;
      letter-spacing: -0.015em; 
      text-align: center; 
      text-shadow: 
        0 0 14px rgba(255, 255, 255, 0.85),
        0 0 28px rgba(144, 205, 244, 0.6),
        0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .lyric-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      animation: wordReveal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: 0 4px;
    }
    @keyframes wordReveal { to { opacity: 1; transform: translateY(0); } }

    .doodle-emote {
      display: inline-block;
      margin-left: 10px;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #bce3ff;
      border: 1.5px solid rgba(188, 227, 255, 0.6);
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(144, 205, 244, 0.16);
      letter-spacing: 0.05em;
      box-shadow: 0 0 14px rgba(188, 227, 255, 0.5);
      animation: gentlePulse 1.4s ease infinite;
      vertical-align: middle;
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* 4. LUMINOUS AMBIENT DRAWING DOODLES */
    .ambient-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 
        0 0 12px rgba(255, 255, 255, 0.85), 
        0 0 24px rgba(144, 205, 244, 0.6);
      animation: floatDoodle 5.5s ease-out forwards;
      opacity: 0.88;
      letter-spacing: 0.08em;
    }

    @keyframes floatDoodle {
      0% { transform: translateY(0) scale(0.75) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; transform: translateY(-30px) scale(1.05) rotate(6deg); }
      75% { opacity: 0.95; }
      100% { transform: translateY(-380px) scale(1.2) rotate(-8deg); opacity: 0; }
    }

    /* Burst Doodles for the Beat Drop (Shoots up in slow motion) */
    .burst-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 9500;
      font-family: 'Courier New', monospace;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(188, 227, 255, 0.9), 0 0 30px rgba(144, 205, 244, 0.8);
      animation: burstFloat 6.5s cubic-bezier(0.12, 0.8, 0.25, 1) forwards;
      opacity: 0;
    }
    @keyframes burstFloat {
      0% { opacity: 0; transform: translateY(0) scale(0.6) rotate(0deg); }
      10% { opacity: 1; transform: translateY(-40px) scale(1.15) rotate(var(--rot, 5deg)); }
      80% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-550px) scale(1.3) rotate(calc(var(--rot, 5deg) * 2)); }
    }
  </style>
</head>
<body>

  <!-- Dynamic code viewport -->
  <div id="code-viewport"></div>
  <div id="dark-veil"></div>
  <div id="beat-flash"></div>

  <script>
    function fillCodeBackground() {
      const container = document.getElementById('code-viewport');
      container.innerHTML = '';
      
      const snippets = [
        '<span class="kw">#include</span> <span class="str">&lt;immintrin.h&gt;</span>',
        '<span class="kw">template</span>&lt;<span class="kw">typename</span> <span class="type">Scalar</span>&gt;',
        '<span class="kw">struct</span> <span class="type">FFTSpectrumEngine</span> {',
        '    <span class="type">size_t</span> <span class="var">dim</span> = <span class="hex">4096</span>;',
        '    <span class="type">uintptr_t</span> <span class="var">alloc_ptr</span> = <span class="hex">0x7FFE9B42A000</span>;',
        '    <span class="fn">execute_butterfly</span>(<span class="var">a</span>, <span class="var">stride</span>);',
        '    __m512d <span class="var">acc</span> = <span class="fn">_mm512_fmadd_pd</span>(<span class="var">r</span>, <span class="var">i</span>, <span class="var">r</span>);',
        '};',
        '<span class="comm">// HESSIAN DRIFT EIGEN ACCUMULATOR</span>',
        '<span class="kw">class</span> <span class="type">NonlinearDriftSolver</span> {',
        '    <span class="type">double</span> <span class="var">jacobian_tensor</span>[<span class="hex">4</span>][<span class="hex">4</span>];',
        '    <span class="fn">eigen_decomp_4x4</span>(<span class="var">jacobian_tensor</span>);',
        '};',
        '<span class="kw">async def</span> <span class="fn">stream_cadence</span>(self) -&gt; <span class="type">AsyncGen</span>:',
        '    <span class="var">cues</span> = [(<span class="hex">0.6</span>, <span class="str">"November"</span>), (<span class="hex">17.2</span>, <span class="str">"call"</span>)]',
        '    <span class="kw">yield</span> {<span class="str">"epoch"</span>: <span class="var">t</span>, <span class="str">"hash"</span>: <span class="hex">0x9E3779B9</span>}',
        '<span class="kw">__global__ void</span> <span class="fn">VectorKernel</span>(<span class="type">float</span>* <span class="var">d_out</span>) {',
        '    <span class="type">int</span> <span class="var">idx</span> = blockIdx.x * blockDim.x + threadIdx.x;',
        '    <span class="var">d_out</span>[<span class="var">idx</span>] = <span class="fn">__fmul_rn</span>(<span class="var">val</span>, <span class="hex">0.9984f</span>);',
        '}'
      ];

      const cols = window.innerWidth > 800 ? 3 : 2;
      const linesNeeded = Math.ceil(window.innerHeight / 10) + 12;

      let lineCounter = 1;
      for (let c = 0; c < cols; c++) {
        const pane = document.createElement('div');
        pane.className = 'code-pane';
        
        let gutterHtml = '';
        let codeHtml = '';
        
        for (let l = 0; l < linesNeeded; l++) {
          gutterHtml += `${lineCounter}<br>`;
          codeHtml += snippets[(l + c * 6) % snippets.length] + '<br>';
          lineCounter++;
        }
        
        pane.innerHTML = `<div class="gutter">${gutterHtml}</div><div class="code-content">${codeHtml}</div>`;
        container.appendChild(pane);
      }
    }

    const TIMED_LYRICS = [
      { time: 0.6,  text: "when i said, November's early", duration: 1.8, emote: "~ ♡" },
      { time: 2.8,  text: "to be playing these songs",     duration: 1.9, emote: "[ ♫ ]" },
      { time: 10.2, text: "now when i look back",          duration: 1.6, emote: "( . . )" },
      { time: 12.4, text: "i can see i was wrong",         duration: 1.8, emote: "</3" },
      { time: 17.2, text: "so what if i call",             duration: 2.4, emote: "[ ☎ ]" },
      { time: 22.0, text: "and you pick up the phone?",    duration: 2.6, emote: "? <3", isClimax: true }
    ];

    let currentCard = null;

    function playLoop() {
      TIMED_LYRICS.forEach((item, idx) => {
        setTimeout(() => {
          const direction = (idx % 2 === 0) ? 'left' : 'right';
          spawnSingleCard(item.text, item.duration, item.emote, direction, item.isClimax);
        }, item.time * 1000);
      });

      // EXACT BEAT DROP EVENT (Triggered at 24.8s right after "pick up the phone?")
      setTimeout(triggerEmotionalBeatDrop, 24800);

      // Loop restart at 32s (giving ample time to absorb the sadness)
      setTimeout(() => {
        if (currentCard) {
          currentCard.classList.add('exiting');
          setTimeout(() => { currentCard?.remove(); currentCard = null; }, 400);
        }
      }, 30500);

      setTimeout(playLoop, 32000);
    }

    // THE EMOTIONAL BEAT DROP ENGINE
    function triggerEmotionalBeatDrop() {
      // 1. Screen tremor & shockwave pulse
      document.body.classList.add('tremor-active');
      setTimeout(() => document.body.classList.remove('tremor-active'), 700);

      const flash = document.getElementById('beat-flash');
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 2800);

      // 2. Transform the active card into an emotional climax beacon
      if (currentCard) {
        currentCard.classList.add('climax-bloom');
        const meta = currentCard.querySelector('.card-meta');
        if (meta) {
          meta.innerHTML = '✦ [ CALL DISCONNECTED • NO ANSWER ] ✦';
          meta.style.color = '#90cdf4';
        }
      }

      // 3. Erupt an emotional swarm of 45+ broken hearts & weeping stars
      for (let i = 0; i < 45; i++) {
        setTimeout(spawnBurstDoodle, i * 45);
      }
    }

    function spawnBurstDoodle() {
      const burstList = ['</3', '♡', '<3', '( . . )', '✧', '*ੈ✩', '˚₊·', '...', '˙ᵕ˙'];
      const el = document.createElement('div');
      el.className = 'burst-doodle';
      el.textContent = burstList[Math.floor(Math.random() * burstList.length)];

      const size = Math.floor(15 + Math.random() * 12);
      el.style.fontSize = `${size}px`;

      const rot = (Math.random() - 0.5) * 35;
      el.style.setProperty('--rot', `${rot}deg`);

      // Radiates across the screen, rising from bottom
      const x = Math.floor(Math.random() * (window.innerWidth - 40));
      const y = Math.floor(window.innerHeight * 0.70 + Math.random() * (window.innerHeight * 0.25));

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 6500);
    }

    function init() {
      fillCodeBackground();
      setInterval(spawnAmbientDoodle, 180);
      playLoop();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
      window.addEventListener('load', init);
    }
    window.addEventListener('resize', fillCodeBackground);

    function spawnSingleCard(fullText, vocalDuration, emote, side, isClimax) {
      if (currentCard) {
        const oldCard = currentCard;
        oldCard.classList.add('exiting');
        setTimeout(() => oldCard.remove(), 400);
      }

      const card = document.createElement('div');
      card.className = `sad-card ${side === 'left' ? 'from-left' : 'from-right'}`;
      card.innerHTML = `<div class="card-meta">✦ LATE NOVEMBER • 02:00 AM ✦</div><div class="card-lyric"></div>`;
      document.body.appendChild(card);
      currentCard = card;

      const cardWidth = card.offsetWidth || 500;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      let targetX, targetY;

      if (screenW < 750) {
        targetX = Math.max(16, (screenW - cardWidth) / 2);
        targetY = screenH * 0.58;
      } else {
        const sideMargin = Math.max(40, screenW * 0.08);
        targetX = (side === 'left') ? sideMargin : (screenW - cardWidth - sideMargin);
        targetY = screenH * 0.56;
      }

      card.style.left = `${targetX}px`;
      card.style.top = `${targetY}px`;

      const lyricEl = card.querySelector('.card-lyric');
      const words = fullText.split(' ');
      const perWordDelay = (vocalDuration * 1000) / words.length;

      words.forEach((word, index) => {
        setTimeout(() => {
          if (!card.parentNode) return;
          const span = document.createElement('span');
          span.className = 'lyric-word';
          span.textContent = word;
          lyricEl.appendChild(span);

          if (emote && index === words.length - 1) {
            const emoteEl = document.createElement('span');
            emoteEl.className = 'doodle-emote';
            emoteEl.textContent = emote;
            lyricEl.appendChild(emoteEl);
          }
        }, index * perWordDelay);
      });
    }

    function spawnAmbientDoodle() {
      const doodleList = ['<3', '♡', '</3', '✧', '˚₊·', '˙ᵕ˙', '( . . )', '[ ✉ ]', '*ੈ✩', '⋆｡°', '୨୧', '☾'];
      const el = document.createElement('div');
      el.className = 'ambient-doodle';
      el.textContent = doodleList[Math.floor(Math.random() * doodleList.length)];
      
      const size = Math.floor(13 + Math.random() * 9);
      el.style.fontSize = `${size}px`;
      
      const x = Math.floor(Math.random() * (window.innerWidth - 40));
      const y = Math.floor(window.innerHeight * 0.74 + Math.random() * (window.innerHeight * 0.22));

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 5500);
    }
  </script>
</body>
  </html>
