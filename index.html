<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Late November</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #05070c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 1. 100% SCREEN-FILLED CODE BACKGROUND */
    #code-viewport {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: #05070c;
      display: flex;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: clamp(6.2px, 1.1vw, 8px);
      line-height: 1.25;
      letter-spacing: -0.01em;
      z-index: 0;
      opacity: 0.82;
      pointer-events: none;
      overflow: hidden;
    }

    .code-pane {
      flex: 1;
      display: flex;
      padding: 6px 10px;
      border-right: 1px solid #101622;
      overflow: hidden;
    }

    .gutter {
      width: 28px;
      text-align: right;
      padding-right: 6px;
      color: #242c3d;
      user-select: none;
      border-right: 1px solid #0d121c;
    }

    .code-content {
      flex: 1;
      padding-left: 8px;
      white-space: pre;
      color: #9aa5b5;
      overflow: hidden;
    }

    .kw { color: #f47067; font-weight: bold; }
    .fn { color: #dcbdfb; }
    .str { color: #96d0ff; }
    .type { color: #8ddb8c; }
    .hex { color: #6cb6ff; }
    .comm { color: #384252; font-style: italic; }
    .var { color: #adbac7; }

    #dark-veil {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 55%, rgba(6, 8, 13, 0.3) 0%, rgba(3, 4, 7, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* ==========================================================
       2. EXTRA-LARGE SAD CARD (CONTINUOUS UPWARD FLOW)
       ========================================================== */
    .sad-card {
      position: fixed;
      width: min(92vw, 520px);
      min-height: 150px;
      padding: 28px 34px;
      background: linear-gradient(150deg, rgba(21, 29, 44, 0.96) 0%, rgba(8, 13, 21, 0.98) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      
      /* Brighter, sharper glowing border */
      border: 1.5px solid rgba(210, 230, 255, 0.55);
      border-radius: 16px;
      box-shadow: 
        0 24px 50px rgba(0, 0, 0, 0.92),
        0 0 30px rgba(144, 205, 244, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 9999;
      pointer-events: none;
      will-change: transform, opacity;
    }

    .sad-card::before {
      content: ''; position: absolute; inset: 7px;
      border: 1px solid rgba(210, 230, 255, 0.25); border-radius: 11px; pointer-events: none;
    }

    /* Continuous Flow Upwards from Left */
    .from-left {
      animation: flowFromLeft 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromLeft {
      0% {
        opacity: 0;
        transform: translate3d(-70px, 45px, 0) scale(0.92) rotate(-3deg);
      }
      12% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotate(-1.2deg);
      }
      100% {
        opacity: 1;
        /* Keeps gliding smoothly upwards */
        transform: translate3d(18px, -110px, 0) scale(1) rotate(-0.5deg);
      }
    }

    /* Continuous Flow Upwards from Right */
    .from-right {
      animation: flowFromRight 6.8s cubic-bezier(0.12, 0.85, 0.3, 1) forwards;
    }
    @keyframes flowFromRight {
      0% {
        opacity: 0;
        transform: translate3d(70px, 45px, 0) scale(0.92) rotate(3deg);
      }
      12% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1) rotate(1.2deg);
      }
      100% {
        opacity: 1;
        /* Keeps gliding smoothly upwards */
        transform: translate3d(-18px, -110px, 0) scale(1) rotate(0.5deg);
      }
    }

    /* Smooth Dissolve Exit continuing upward */
    .sad-card.exiting {
      animation: exitDissolve 0.35s ease-out forwards !important;
    }
    @keyframes exitDissolve {
      to {
        opacity: 0;
        transform: translateY(-145px) scale(0.94);
      }
    }

    .card-meta {
      font-family: 'Courier New', monospace; 
      font-size: 11.5px; 
      letter-spacing: 0.2em;
      text-transform: uppercase; 
      color: rgba(210, 230, 255, 0.8); 
      text-align: center; 
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(144, 205, 244, 0.4);
    }

    /* RADIANT BRIGHT LYRICS */
    .card-lyric {
      color: #ffffff; /* Pure bright white */
      font-size: clamp(20px, 2.5vw, 25px); 
      font-weight: 650; 
      line-height: 1.5;
      letter-spacing: -0.015em; 
      text-align: center; 
      /* Brilliant illuminated white-blue bloom */
      text-shadow: 
        0 0 14px rgba(255, 255, 255, 0.85),
        0 0 28px rgba(144, 205, 244, 0.6),
        0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .lyric-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(6px);
      animation: wordReveal 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      margin: 0 4px;
    }
    @keyframes wordReveal { to { opacity: 1; transform: translateY(0); } }

    .doodle-emote {
      display: inline-block;
      margin-left: 10px;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      font-weight: bold;
      color: #bce3ff;
      border: 1.5px solid rgba(188, 227, 255, 0.6);
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(144, 205, 244, 0.16);
      letter-spacing: 0.05em;
      box-shadow: 0 0 14px rgba(188, 227, 255, 0.5);
      animation: gentlePulse 1.4s ease infinite;
      vertical-align: middle;
    }
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* ==========================================================
       3. BRIGHTER, RICHER AMBIENT DRAWING DOODLES
       ========================================================== */
    .ambient-doodle {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      font-family: 'Courier New', monospace;
      font-weight: 700;
      color: #ffffff;
      /* Intense luminous chalk glow */
      text-shadow: 
        0 0 12px rgba(255, 255, 255, 0.85), 
        0 0 24px rgba(144, 205, 244, 0.6);
      animation: floatDoodle 5.5s ease-out forwards;
      opacity: 0.88;
      letter-spacing: 0.08em;
    }

    @keyframes floatDoodle {
      0% { transform: translateY(0) scale(0.75) rotate(0deg); opacity: 0; }
      20% { opacity: 0.95; transform: translateY(-30px) scale(1.05) rotate(6deg); }
      75% { opacity: 0.95; }
      100% { transform: translateY(-380px) scale(1.2) rotate(-8deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Dynamic code viewport -->
  <div id="code-viewport"></div>
  <div id="dark-veil"></div>

  <script>
    // 1. DYNAMICALLY FILLS 100% OF SCREEN
    function fillCodeBackground() {
      const container = document.getElementById('code-viewport');
      container.innerHTML = '';
      
      const snippets = [
        '<span class="kw">#include</span> <span class="str">&lt;immintrin.h&gt;</span>',
        '<span class="kw">template</span>&lt;<span class="kw">typename</span> <span class="type">Scalar</span>&gt;',
        '<span class="kw">struct</span> <span class="type">FFTSpectrumEngine</span> {',
        '    <span class="type">size_t</span> <span class="var">dim</span> = <span class="hex">4096</span>;',
        '    <span class="type">uintptr_t</span> <span class="var">alloc_ptr</span> = <span class="hex">0x7FFE9B42A000</span>;',
        '    <span class="fn">execute_butterfly</span>(<span class="var">a</span>, <span class="var">stride</span>);',
        '    __m512d <span class="var">acc</span> = <span class="fn">_mm512_fmadd_pd</span>(<span class="var">r</span>, <span class="var">i</span>, <span class="var">r</span>);',
        '};',
        '<span class="comm">// HESSIAN DRIFT EIGEN ACCUMULATOR</span>',
        '<span class="kw">class</span> <span class="type">NonlinearDriftSolver</span> {',
        '    <span class="type">double</span> <span class="var">jacobian_tensor</span>[<span class="hex">4</span>][<span class="hex">4</span>];',
        '    <span class="fn">eigen_decomp_4x4</span>(<span class="var">jacobian_tensor</span>);',
        '};',
        '<span class="kw">async def</span> <span class="fn">stream_cadence</span>(self) -&gt; <span class="type">AsyncGen</span>:',
        '    <span class="var">cues</span> = [(<span class="hex">0.6</span>, <span class="str">"November"</span>), (<span class="hex">17.2</span>, <span class="str">"call"</span>)]',
        '    <span class="kw">yield</span> {<span class="str">"epoch"</span>: <span class="var">t</span>, <span class="str">"hash"</span>: <span class="hex">0x9E3779B9</span>}',
        '<span class="kw">__global__ void</span> <span class="fn">VectorKernel</span>(<span class="type">float</span>* <span class="var">d_out</span>) {',
        '    <span class="type">int</span> <span class="var">idx</span> = blockIdx.x * blockDim.x + threadIdx.x;',
        '    <span class="var">d_out</span>[<span class="var">idx</span>] = <span class="fn">__fmul_rn</span>(<span class="var">val</span>, <span class="hex">0.9984f</span>);',
        '}'
      ];

      const cols = window.innerWidth > 800 ? 3 : 2;
      const linesNeeded = Math.ceil(window.innerHeight / 10) + 12;

      let lineCounter = 1;
      for (let c = 0; c < cols; c++) {
        const pane = document.createElement('div');
        pane.className = 'code-pane';
        
        let gutterHtml = '';
        let codeHtml = '';
        
        for (let l = 0; l < linesNeeded; l++) {
          gutterHtml += `${lineCounter}<br>`;
          codeHtml += snippets[(l + c * 6) % snippets.length] + '<br>';
          lineCounter++;
        }
        
        pane.innerHTML = `<div class="gutter">${gutterHtml}</div><div class="code-content">${codeHtml}</div>`;
        container.appendChild(pane);
      }
    }

    // 2. TIMED LYRICS (LEFT, RIGHT, LEFT, RIGHT...)
    const TIMED_LYRICS = [
      { time: 0.6,  text: "when i said, November's early", duration: 1.8, emote: "~ ♡" },
      { time: 2.8,  text: "to be playing these songs",     duration: 1.9, emote: "[ ♫ ]" },
      { time: 10.2, text: "now when i look back",          duration: 1.6, emote: "( . . )" },
      { time: 12.4, text: "i can see i was wrong",         duration: 1.8, emote: "</3" },
      { time: 17.2, text: "so what if i call",             duration: 2.4, emote: "[ ☎ ]" },
      { time: 22.0, text: "and you pick up the phone?",    duration: 2.6, emote: "? <3" }
    ];

    let currentCard = null; // Strictly only one box at a time

    function playLoop() {
      TIMED_LYRICS.forEach((item, idx) => {
        setTimeout(() => {
          const direction = (idx % 2 === 0) ? 'left' : 'right';
          spawnSingleCard(item.text, item.duration, item.emote, direction);
        }, item.time * 1000);
      });

      // Clear the last card cleanly after the song ends, then loop
      setTimeout(() => {
        if (currentCard) {
          currentCard.classList.add('exiting');
          setTimeout(() => { currentCard?.remove(); currentCard = null; }, 350);
        }
      }, 26500);

      setTimeout(playLoop, 28000);
    }

    function init() {
      fillCodeBackground();
      
      // SPAWNS DOODLES MUCH FASTER (Every 180ms = rich stream of doodles!)
      setInterval(spawnAmbientDoodle, 180);
      playLoop();
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    } else {
      document.addEventListener('DOMContentLoaded', init);
      window.addEventListener('load', init);
    }
    window.addEventListener('resize', fillCodeBackground);

    // SPAWNS ONLY ONE CARD WITH CONTINUOUS UPWARD FLOW
    function spawnSingleCard(fullText, vocalDuration, emote, side) {
      if (currentCard) {
        const oldCard = currentCard;
        oldCard.classList.add('exiting');
        setTimeout(() => oldCard.remove(), 350);
      }

      const card = document.createElement('div');
      card.className = `sad-card ${side === 'left' ? 'from-left' : 'from-right'}`;
      card.innerHTML = `<div class="card-meta">✦ LATE NOVEMBER • 02:00 AM ✦</div><div class="card-lyric"></div>`;
      document.body.appendChild(card);
      currentCard = card;

      const cardWidth = card.offsetWidth || 500;
      const screenW = window.innerWidth;
      const screenH = window.innerHeight;
      let targetX, targetY;

      if (screenW < 750) {
        targetX = Math.max(16, (screenW - cardWidth) / 2);
        targetY = screenH * 0.60;
      } else {
        const sideMargin = Math.max(40, screenW * 0.08);
        targetX = (side === 'left') ? sideMargin : (screenW - cardWidth - sideMargin);
        targetY = screenH * 0.58;
      }

      card.style.left = `${targetX}px`;
      card.style.top = `${targetY}px`;

      // Word-by-Word Engine
      const lyricEl = card.querySelector('.card-lyric');
      const words = fullText.split(' ');
      const perWordDelay = (vocalDuration * 1000) / words.length;

      words.forEach((word, index) => {
        setTimeout(() => {
          if (!card.parentNode) return;
          const span = document.createElement('span');
          span.className = 'lyric-word';
          span.textContent = word;
          lyricEl.appendChild(span);

          if (emote && index === words.length - 1) {
            const emoteEl = document.createElement('span');
            emoteEl.className = 'doodle-emote';
            emoteEl.textContent = emote;
            lyricEl.appendChild(emoteEl);
          }
        }, index * perWordDelay);
      });
    }

    // EXPANDED POOL OF BRIGHT FLOATING DRAWING DOODLES
    function spawnAmbientDoodle() {
      const doodleList = ['<3', '♡', '</3', '✧', '˚₊·', '˙ᵕ˙', '( . . )', '[ ✉ ]', '*ੈ✩', '⋆｡°', '୨୧', '☾'];
      const el = document.createElement('div');
      el.className = 'ambient-doodle';
      el.textContent = doodleList[Math.floor(Math.random() * doodleList.length)];
      
      const size = Math.floor(13 + Math.random() * 9);
      el.style.fontSize = `${size}px`;
      
      // Spawns smoothly across entire screen width
      const x = Math.floor(Math.random() * (window.innerWidth - 40));
      const y = Math.floor(window.innerHeight * 0.74 + Math.random() * (window.innerHeight * 0.22));

      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 5500);
    }
  </script>
</body>
</html>
